                  android:textSize="11sp" android:textColor="#B0BEC5" />
          </LinearLayout>
          EOF

          F=app/src/main/java/com/example/tidewidget/TideWidget.kt
          sed -i 's|val hPx = (52 \* dens).toInt()|val hPx = (64 * dens).toInt()|' $F
          sed -i 's|textPaint.textSize = 9f \* dens|textPaint.textSize = 12f * dens|' $F
          sed -i 's|textPaint.color = 0xFFB0BEC5.toInt()|textPaint.color = 0xFFFFFFFF.toInt()|' $F
          sed -i 's|val padTop = 13f \* dens|val padTop = 16f * dens|' $F
          sed -i 's|val padBot = 13f \* dens|val padBot = 16f * dens|' $F
          sed -i 's|y + 11f \* dens|y + 13f * dens|' $F
          sed -i 's|(%+.1f ft vs predicted)|(%+.1f vs pred.)|' $F  
      - name: Build APK
