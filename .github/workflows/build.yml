name: Build Tide Widget
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Write project files
        run: |
          mkdir -p app/src/main/java/com/example/tidewidget app/src/main/res/layout app/src/main/res/xml app/src/main/res/drawable

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
              plugins {
                  id("com.android.application") version "8.5.2"
                  id("org.jetbrains.kotlin.android") version "1.9.24"
              }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "TideWidget"
          include(":app")
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.example.tidewidget"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.example.tidewidget"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application android:label="Tide Widget">
                  <receiver android:name=".TideWidget" android:exported="true">
                      <intent-filter>
                          <action android:name="android.appwidget.action.APPWIDGET_UPDATE" />
                      </intent-filter>
                      <meta-data
                          android:name="android.appwidget.provider"
                          android:resource="@xml/tide_widget_info" />
                  </receiver>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/xml/tide_widget_info.xml <<'EOF'
          <appwidget-provider xmlns:android="http://schemas.android.com/apk/res/android"
              android:minWidth="180dp"
              android:minHeight="110dp"
              android:updatePeriodMillis="1800000"
              android:initialLayout="@layout/widget"
              android:resizeMode="horizontal|vertical"
              android:widgetCategory="home_screen" />
          EOF

          cat > app/src/main/res/drawable/bg.xml <<'EOF'
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <solid android:color="#E6102030" />
              <corners android:radius="20dp" />
          </shape>
          EOF

          cat > app/src/main/res/layout/widget.xml <<'EOF'
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:id="@+id/root"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:padding="16dp"
              android:background="@drawable/bg">

              <TextView android:id="@+id/status"
                  android:layout_width="wrap_content" android:layout_height="wrap_content"
                  android:textSize="22sp" android:textStyle="bold" android:textColor="#FFFFFF" />

              <TextView android:id="@+id/lbl1"
                  android:layout_width="wrap_content" android:layout_height="wrap_content"
                  android:layout_marginTop="10dp"
                  android:textSize="11sp" android:letterSpacing="0.1" android:textColor="#90A4AE" />
              <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content"
                  android:orientation="horizontal">
                  <TextView android:id="@+id/time1"
                      android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1"
                      android:textSize="16sp" android:textStyle="bold" android:textColor="#FFFFFF" />
                  <TextView android:id="@+id/ht1"
                      android:layout_width="wrap_content" android:layout_height="wrap_content"
                      android:textSize="16sp" android:textColor="#FFFFFF" />
              </LinearLayout>

              <TextView android:id="@+id/lbl2"
                  android:layout_width="wrap_content" android:layout_height="wrap_content"
                  android:layout_marginTop="8dp"
                  android:textSize="11sp" android:letterSpacing="0.1" android:textColor="#90A4AE" />
              <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content"
                  android:orientation="horizontal">
                  <TextView android:id="@+id/time2"
                      android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1"
                      android:textSize="16sp" android:textStyle="bold" android:textColor="#FFFFFF" />
                  <TextView android:id="@+id/ht2"
                      android:layout_width="wrap_content" android:layout_height="wrap_content"
                      android:textSize="16sp" android:textColor="#FFFFFF" />
              </LinearLayout>

              <TextView android:id="@+id/lblRange"
                  android:layout_width="wrap_content" android:layout_height="wrap_content"
                  android:layout_marginTop="8dp"
                  android:text="RANGE"
                  android:textSize="11sp" android:letterSpacing="0.1" android:textColor="#90A4AE" />
              <TextView android:id="@+id/range"
                  android:layout_width="wrap_content" android:layout_height="wrap_content"
                  android:textSize="16sp" android:textStyle="bold" android:textColor="#FFFFFF" />

              <TextView android:id="@+id/updated"
                  android:layout_width="wrap_content" android:layout_height="wrap_content"
                  android:layout_marginTop="8dp"
                  android:textSize="11sp" android:textColor="#78909C" />
          </LinearLayout>
          EOF

          cat > app/src/main/java/com/example/tidewidget/TideWidget.kt <<'EOF'
          package com.example.tidewidget

          import android.app.PendingIntent
          import android.appwidget.AppWidgetManager
          import android.appwidget.AppWidgetProvider
          import android.content.Context
          import android.content.Intent
          import android.widget.RemoteViews
          import org.json.JSONObject
          import java.net.HttpURLConnection
          import java.net.URL
          import java.text.SimpleDateFormat
          import java.util.Calendar
          import java.util.Date
          import java.util.Locale
          import kotlin.concurrent.thread

          // NOAA station ID. Change this to use a different location.
          private const val STATION = "8658163"

          data class TideEvent(val time: Date, val height: Double, val isHigh: Boolean)

          class TideWidget : AppWidgetProvider() {
              override fun onUpdate(context: Context, manager: AppWidgetManager, ids: IntArray) {
                  val pending = goAsync()
                  thread {
                      try {
                          val events = try { fetchTides() } catch (e: Exception) { null }
                          manager.updateAppWidget(ids, buildViews(context, events, ids))
                      } finally {
                          pending.finish()
                      }
                  }
              }
          }

          private fun fetchTides(): List<TideEvent> {
              val day = SimpleDateFormat("yyyyMMdd", Locale.US)
              val start = Calendar.getInstance().apply { add(Calendar.DAY_OF_YEAR, -1) }.time
              val end = Calendar.getInstance().apply { add(Calendar.DAY_OF_YEAR, 3) }.time
              val url = URL(
                  "https://api.tidesandcurrents.noaa.gov/api/prod/datagetter" +
                  "?product=predictions&application=TideWidget" +
                  "&begin_date=${day.format(start)}&end_date=${day.format(end)}" +
                  "&datum=MLLW&station=$STATION&time_zone=lst_ldt&units=english" +
                  "&interval=hilo&format=json"
              )
              val conn = url.openConnection() as HttpURLConnection
              conn.connectTimeout = 10000
              conn.readTimeout = 10000
              try {
                  val body = conn.inputStream.bufferedReader().readText()
                  val arr = JSONObject(body).getJSONArray("predictions")
                  val parse = SimpleDateFormat("yyyy-MM-dd HH:mm", Locale.US)
                  val out = ArrayList<TideEvent>()
                  for (i in 0 until arr.length()) {
                      val o = arr.getJSONObject(i)
                      val t = parse.parse(o.getString("t")) ?: continue
                      out.add(TideEvent(t, o.getString("v").toDouble(), o.getString("type") == "H"))
                  }
                  return out.sortedBy { it.time }
              } finally {
                  conn.disconnect()
              }
          }

          private fun fmt(d: Date, now: Date): String {
              val dayFmt = SimpleDateFormat("yyyyMMdd", Locale.US)
              val sameDay = dayFmt.format(d) == dayFmt.format(now)
              return SimpleDateFormat(if (sameDay) "h:mm a" else "EEE h:mm a", Locale.getDefault()).format(d)
          }

          private fun ft(x: Double): String = String.format(Locale.US, "%.1f ft", x)

          private fun buildViews(context: Context, events: List<TideEvent>?, ids: IntArray): RemoteViews {
              val v = RemoteViews(context.packageName, R.layout.widget)
              val tap = Intent(context, TideWidget::class.java).apply {
                  action = AppWidgetManager.ACTION_APPWIDGET_UPDATE
                  putExtra(AppWidgetManager.EXTRA_APPWIDGET_IDS, ids)
              }
              v.setOnClickPendingIntent(
                  R.id.root,
                  PendingIntent.getBroadcast(context, 0, tap, PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE)
              )

              val now = Date()
              val upcoming = events?.filter { it.time.after(now) } ?: emptyList()
              val first = upcoming.getOrNull(0)
              val second = upcoming.getOrNull(1)

              if (first == null || second == null) {
                  v.setTextViewText(R.id.status, "No tide data")
                  v.setTextViewText(R.id.lbl1, "")
                  v.setTextViewText(R.id.time1, "Check connection")
                  v.setTextViewText(R.id.ht1, "")
                  v.setTextViewText(R.id.lbl2, "")
                  v.setTextViewText(R.id.time2, "")
                  v.setTextViewText(R.id.ht2, "")
                  v.setTextViewText(R.id.range, "")
                  v.setTextViewText(R.id.updated, "Tap to retry")
                  return v
              }

              if (first.isHigh) {
                  v.setTextViewText(R.id.status, "\u25B2 RISING")
                  v.setTextColor(R.id.status, 0xFF4FC3F7.toInt())
              } else {
                  v.setTextViewText(R.id.status, "\u25BC FALLING")
                  v.setTextColor(R.id.status, 0xFFFFB74D.toInt())
              }

              v.setTextViewText(R.id.lbl1, if (first.isHigh) "NEXT HIGH" else "NEXT LOW")
              v.setTextViewText(R.id.time1, fmt(first.time, now))
              v.setTextViewText(R.id.ht1, ft(first.height))

              v.setTextViewText(R.id.lbl2, if (second.isHigh) "THEN HIGH" else "THEN LOW")
              v.setTextViewText(R.id.time2, fmt(second.time, now))
              v.setTextViewText(R.id.ht2, ft(second.height))

              v.setTextViewText(R.id.range, ft(Math.abs(first.height - second.height)))
              v.se
