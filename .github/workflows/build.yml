              </LinearLayout>

              <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content"
                  android:orientation="horizontal" android:layout_marginTop="6dp">
                  <LinearLayout android:layout_width="0dp" android:layout_height="wrap_content"
                      android:layout_weight="1" android:orientation="vertical">
                      <TextView android:id="@+id/lbl1"
                          android:layout_width="wrap_content" android:layout_height="wrap_content"
                          android:textSize="11sp" android:textStyle="bold" android:letterSpacing="0.08" android:textColor="#CFD8DC" />
                      <TextView android:id="@+id/time1"
                          android:layout_width="wrap_content" android:layout_height="wrap_content"
                          android:maxLines="1"
                          android:textSize="19sp" android:textStyle="bold" android:textColor="#FFFFFF" />
                      <TextView android:id="@+id/ht1"
                          android:layout_width="wrap_content" android:layout_height="wrap_content"
                          android:textSize="16sp" android:textColor="#FFFFFF" />
                  </LinearLayout>
                  <LinearLayout android:layout_width="0dp" android:layout_height="wrap_content"
                      android:layout_weight="1" android:orientation="vertical">
                      <TextView android:id="@+id/lbl2"
                          android:layout_width="wrap_content" android:layout_height="wrap_content"
                          android:textSize="11sp" android:textStyle="bold" android:letterSpacing="0.08" android:textColor="#CFD8DC" />
                      <TextView android:id="@+id/time2"
                          android:layout_width="wrap_content" android:layout_height="wrap_content"
                          android:maxLines="1"
                          android:textSize="19sp" android:textStyle="bold" android:textColor="#FFFFFF" />
                      <TextView android:id="@+id/ht2"
                          android:layout_width="wrap_content" android:layout_height="wrap_content"
                          android:textSize="16sp" android:textColor="#FFFFFF" />
                  </LinearLayout>
              </LinearLayout>

              <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content"
                  android:orientation="horizontal" android:layout_marginTop="6dp">
                  <TextView android:id="@+id/now"
                      android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1"
                      android:maxLines="1" android:ellipsize="end"
                      android:textSize="15sp" android:textStyle="bold" android:textColor="#FFFFFF" />
                  <TextView android:id="@+id/range"
                      android:layout_width="wrap_content" android:layout_height="wrap_content"
                      android:maxLines="1"
                      android:textSize="15sp" android:textStyle="bold" android:textColor="#80DEEA" />
              </LinearLayout>

              <ImageView android:id="@+id/curve"
                  android:layout_width="match_parent" android:layout_height="64dp"
                  android:layout_marginTop="6dp"
                  android:scaleType="fitXY" />

              <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content"
                  android:orientation="horizontal" android:layout_marginTop="6dp">
                  <LinearLayout android:layout_width="0dp" android:layout_height="wrap_content"
